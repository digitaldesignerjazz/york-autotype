name: York Heartbeat

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate heartbeat
        id: hb
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "York Autotype heartbeat at $TIMESTAMP"
          mkdir -p status
          cat > status/last_heartbeat.json << EOF
          {
            "agent": "york-autotype",
            "status": "alive",
            "timestamp": "$TIMESTAMP",
            "repo": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "mesh_ready": true,
            "message": "York Autotype node is online and mesh-capable"
          }
          EOF
          cat status/last_heartbeat.json

      - name: Commit heartbeat status
        run: |
          git config user.name "York Autotype Heartbeat"
          git config user.email "york-autotype[bot]@users.noreply.github.com"
          git add status/last_heartbeat.json
          git diff --staged --quiet || git commit -m "chore(heartbeat): York Autotype alive @ ${{ steps.hb.outputs.timestamp }}"
          git push
        continue-on-error: true
