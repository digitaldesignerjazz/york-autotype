[package]
name = "york-autotype"
version = "0.1.0"
edition = "2021"
authors = ["Sven Normen Esslinger <Esslinger & Co.>"]
description = "York Autotype — Autonomous automation prototype with nxmesh AgentHeartbeat for the Nexus ecosystem"
license = "MIT OR Apache-2.0"
repository = "https://github.com/digitaldesignerjazz/york-autotype"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

# nxmesh is developed in the sibling nexus repository.
# For local development use a path dependency:
# nxmesh = { path = "../nexus/mesh/noise-quic" }
#
# Once published or vendored, switch to git:
# nxmesh = { git = "https://github.com/digitaldesignerjazz/nexus", branch = "main" }

[lib]
name = "york_autotype"
path = "src/lib.rs"

[[bin]]
name = "york-heartbeat"
path = "src/bin/york-heartbeat.rs"
